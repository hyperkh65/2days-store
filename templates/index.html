<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Days - 디지털 상품 배송</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #7c3aed 50%, #1e293b 100%);
            min-height: 100vh;
            color: white;
        }

        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .blob {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 20s infinite ease-in-out;
        }

        .blob1 { background: #7c3aed; top: 10%; left: 10%; }
        .blob2 { background: #3b82f6; bottom: 10%; right: 10%; animation-delay: -10s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h1 {
            font-size: 24px;
            font-weight: bold;
        }

        .logo-text p {
            font-size: 12px;
            color: #c084fc;
        }

        .social-links {
            display: flex;
            gap: 16px;
        }

        .social-links a {
            color: rgba(255,255,255,0.6);
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: white;
        }

        main {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-radius: 50px;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #c084fc;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        h2 {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 20px;
            color: rgba(255,255,255,0.7);
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 16px 24px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3);
        }

        input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .status-message {
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .status-message.show {
            display: flex;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .status-error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .status-loading {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }

        button {
            width: 100%;
            padding: 16px 32px;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(124, 58, 237, 0.5);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            color: rgba(255,255,255,0.6);
            font-size: 14px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 48px;
        }

        .feature {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 24px;
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            background: rgba(124, 58, 237, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .feature h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .feature p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 80px;
        }

        footer a {
            color: #c084fc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">📦</div>
                <div class="logo-text">
                    <h1>2Days</h1>
                    <p>Digital Store</p>
                </div>
            </div>
            <div class="social-links">
                <a href="https://2days.kr" target="_blank">🌐</a>
                <a href="https://twitter.com/2dayskr" target="_blank">🐦</a>
                <a href="https://2days.kr" target="_blank">📰</a>
            </div>
        </header>

        <main>
            <div class="hero">
                <div class="badge">
                    <div class="pulse"></div>
                    <span>디지털 상품 즉시 배송</span>
                </div>
                <h2>
                    구매한 상품을<br>
                    <span class="gradient-text">이메일로 받아보세요</span>
                </h2>
                <p class="subtitle">상품번호만 입력하면 자동으로 다운로드 링크가 발송됩니다</p>
            </div>

            <div class="card">
                <div id="statusMessage" class="status-message"></div>

                <div class="form-group">
                    <label>
                        <span>✉️</span>
                        이메일 주소
                    </label>
                    <input type="email" id="email" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>
                        <span>📦</span>
                        상품 번호
                    </label>
                    <input type="text" id="productCode" placeholder="예: PROD-12345">
                </div>

                <button id="submitBtn" onclick="handleSubmit()">
                    <span>🚀</span>
                    상품 받기
                </button>

                <div class="info">
                    💡 상품번호는 구매 확인 메일에서 확인하실 수 있습니다
                </div>
            </div>

            <div class="features">
                <div class="feature">
                    <div class="feature-icon">⚡</div>
                    <h3>즉시 배송</h3>
                    <p>입력 즉시 이메일로 다운로드 링크가 발송됩니다</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">🔒</div>
                    <h3>안전한 전송</h3>
                    <p>암호화된 링크로 안전하게 파일을 받아보세요</p>
                </div>
                <div class="feature">
                    <div class="feature-icon">🎯</div>
                    <h3>24/7 지원</h3>
                    <p>언제든지 상품을 다시 받으실 수 있습니다</p>
                </div>
            </div>
        </main>

        <footer>
            <p>© 2026 2Days. All rights reserved.</p>
            <p><a href="https://2days.kr">블로그</a> · <a href="https://2days.kr">티스토리</a> · <a href="https://twitter.com/2dayskr">Threads</a></p>
        </footer>
    </div>

    <script>
        async function handleSubmit() {
            const email = document.getElementById('email').value;
            const productCode = document.getElementById('productCode').value;
            const statusEl = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');

            // 입력 검증
            if (!email || !productCode) {
                showStatus('error', '이메일과 상품번호를 모두 입력해주세요');
                return;
            }

            // 이메일 형식 검증
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showStatus('error', '올바른 이메일 주소를 입력해주세요');
                return;
            }

            // 로딩 상태
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div> 발송 중...';
            showStatus('loading', '상품을 찾고 있습니다...');

            try {
                const response = await fetch('/api/send-product', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, productCode })
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus('success', `✅ ${email}로 상품이 발송되었습니다! 메일함을 확인해주세요.`);
                    document.getElementById('email').value = '';
                    document.getElementById('productCode').value = '';

                    setTimeout(() => {
                        statusEl.classList.remove('show');
                    }, 5000);
                } else {
                    showStatus('error', data.error || '발송에 실패했습니다');
                }
            } catch (error) {
                showStatus('error', '네트워크 오류가 발생했습니다. 다시 시도해주세요.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>🚀</span> 상품 받기';
            }
        }

        function showStatus(type, message) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = `status-message status-${type} show`;

            let icon = '';
            if (type === 'success') icon = '✅';
            else if (type === 'error') icon = '❌';
            else if (type === 'loading') icon = '<div class="spinner"></div>';

            statusEl.innerHTML = `${icon} <span>${message}</span>`;
        }

        // Enter 키로 제출
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSubmit();
            }
        });
    </script>
</body>
</html>
